  rarity-multipliers:
    common: 1.0
    uncommon: 1.2
    rare: 1.55
    epic: 2.25
    legendary: 3.2

scoreboard:
  enabled: true
  title: "&6&lSUS &e&lSMP &f&lSEASON 2"
  update-ticks: 40

messages:
  prefix: "&8[&6&lSus &e&lSMP &fSeason 2&8] &r"
  no-permission: "&cYou do not have permission."
  player-not-found: "&cPlayer not found: &e{player}"
  invalid-amount: "&cInvalid amount."
  not-enough-money: "&cNot enough money. Balance: &e{balance}"
  cannot-pay-self: "&cYou cannot transfer money to yourself."

gui:
  shop-title: "&8[&6Shop&8]"
  trade-title: "&8[&eTrade&8]"
  background-item: BLACK_STAINED_GLASS_PANE
